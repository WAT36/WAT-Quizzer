name: Deploy to AWS (dev)

on:
  push:
    branches: ['develop']
  # Actionsの画面から手動実行した場合は、変更の有無にかかわらず全てデプロイする
  workflow_dispatch:

permissions:
  contents: read

# 前のデプロイが終わるまで次のrunを待たせる（同時に走って古いコミットが後からデプロイされるのを防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 最後に成功したrunからの変更ファイルを見て、バックエンド・フロントエンドのどちらをデプロイするか判定する
  # 直前のpushとの差分ではなく最後の成功runと比べるので、失敗・キャンセルされたrunの変更も次のrunでデプロイされる
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 最後に成功したrunを調べるため
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_all() {
            echo "$1 → 全てデプロイする" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${{ github.event_name }}" = "workflow_dispatch" ] && deploy_all "手動実行"

          base=$(gh run list --workflow develop.yml --branch develop --status success --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            deploy_all "比較元の成功runが見つからない"
          fi
          files=$(git diff --name-only "$base" HEAD)

          # 両方に影響するもの: 共通ライブラリ・ワークフロー・ルートの依存/設定
          shared='^(quizzer-lib/|\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$)'
          # バックエンド: SAM(template.yaml + Dockerfile)でデプロイされるもの
          backend='^(backend-nest/|Dockerfile$|infra/template\.yaml$|infra/samconfig\.toml$|infra/lambda/)'
          # フロントエンド: Next.js と CDK(BackendStack・FrontendStack はDynamoDB等のインフラでフロントのジョブでデプロイ)
          frontend='^(frontend-next/|infra/(bin|lib)/|infra/cdk\.json$|infra/package(-lock)?\.json$|infra/tsconfig\.json$)'

          has() { printf '%s\n' "$files" | grep -qE "$1|$shared" && echo true || echo false; }
          echo "backend=$(has "$backend")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has "$frontend")" >> "$GITHUB_OUTPUT"

          {
            echo "比較元: \`$base\`"
            echo "- backend: $(has "$backend")"
            echo "- frontend: $(has "$frontend")"
          } >> "$GITHUB_STEP_SUMMARY"

  # 3パッケージのESLint(lint.yml)。エラーがある場合はデプロイしない
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  # バックエンドのUT。失敗した場合はバックエンドをデプロイしない
  backend-test:
    name: Backend Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Backend Unit test
        run: pnpm run test
        working-directory: backend-nest

  # フロントのE2Eテスト(frontend-e2e.yml)。失敗した場合はフロントをデプロイしない
  frontend-e2e:
    name: Frontend E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-e2e.yml

  frontend-test:
    name: Frontend Tests (Storybook)
    runs-on: ubuntu-latest
    # 2026-08-20時点でactionsがタイムアウトするため一旦無効化。落ち着いたら復活させてOK（deploy-frontend・deploy-mockのneedsにも追加すること）
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS認証情報は不要（モックモードビルドのみで完結するテスト）
      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm run build-storybook
        working-directory: frontend-next

      # Recoil(状態管理ライブラリ、2024年2月で開発終了)がStorybookのテスト環境でのみ
      # React 18.3.1の内部構造と非互換でクラッシュするコンポーネント群があり、現状では
      # test-storybookを完全green化できない。結果は記録するがデプロイはブロックしない。
      - name: Run Storybook tests (interaction + a11y)
        continue-on-error: true
        run: |
          pnpm exec serve storybook-static -l 6006 &
          pnpm exec wait-on http://127.0.0.1:6006
          pnpm run test-storybook
        working-directory: frontend-next

  # SAMでAPI(backend-nest)をデプロイする。ビルドはDockerfile内で行うためpnpmのセットアップは不要
  deploy-backend:
    name: Deploy Backend (develop)
    needs: [changes, lint, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare .env file
        run: |
          aws ssm get-parameter --name /github/quizzer/dev --output json | jq -r .Parameter.Value > .env
          cut -d= -f2 .env  | xargs -I arg echo ::add-mask::arg
          cat .env >> "$GITHUB_ENV"

      # SAM設定
      - name: Setup aws-sam
        uses: aws-actions/setup-sam@v2

      # SAM APIビルド・デプロイ
      - name: Build & Deploy API
        run: |
          cd ./infra
          sam build
          export PRISMA_CLI_BINARY_TARGETS="native,rhel-openssl-1.0.x,rhel-openssl-3.0.x"
          sam deploy  --no-confirm-changeset \
                      --image-repository $IMAGE_REPOSITORY  \
                      --parameter-overrides \
                        Region=$REGION \
                        DbUrl=$DATABASE_URL \
                        PrismaTarget=$PRISMA_CLI_BINARY_TARGETS \
                        QuizzerApiCertificateArn=$QUIZZER_API_CERTIFICATE_ARN \
                        QuizzerApiDomainName=$QUIZZER_API_DOMAIN_NAME \
                        HostZoneId=$HOSTZONE_ID \
                        CognitoUserpoolId=$AWS_COGNITO_USERPOOL_ID \
                        CognitoAppClientId=$AWS_COGNITO_APPCLIENT_ID \
                        QuizImageS3BucketName=$QUIZ_IMAGE_S3_BUCKET \
                        Akey=$AKEY \
                        SAkey=$SAKEY \
                        WiktionaryApiUrl=$WIKTIONARY_API_URL \
                        FreeDictionaryApiUrl=$FREE_DICTIONARY_API_URL \
                        FrontOrigin=https://$FRONT_DOMAIN_NAME
        env:
          AKEY: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          SAKEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}

      # ECRの古いイメージを手動削除とライフサイクルポリシー適用
      - name: cleanup old ECR images and apply lifecycle policy
        run: |
          # SAMが作成するECRリポジトリ名を取得（通常はsam-prisma-<stack-name>形式→いつの間にか変わってるのでsamquizzerapiに変更）
          REPO_NAME=$(aws ecr describe-repositories --query 'repositories[?contains(repositoryName, `samquizzerapi`)].repositoryName' --output text | head -1)
          if [ -n "$REPO_NAME" ]; then
            # ライフサイクルポリシーを適用
            aws ecr put-lifecycle-policy --repository-name $REPO_NAME --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Keep only the latest 5 images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 5
                  },
                  "action": {
                    "type": "expire"
                  }
                }
              ]
            }'
            
            # 最新の5つ以外のイメージを削除（日付降順でソートして古いものを対象にする）
            aws ecr describe-images --repository-name $REPO_NAME --output json | \
            jq -r '[.imageDetails[] | select(.imageTags != null and (.imageTags | length) > 0)] | sort_by(.imagePushedAt) | reverse | .[5:] | .[].imageTags[0]' | \
            xargs -I {} aws ecr batch-delete-image --repository-name $REPO_NAME --image-ids imageTag={} || true
          fi

  # CDKスタックとフロントエンド(S3 + CloudFront)をデプロイする。SAMとは別スタックなのでdeploy-backendと並列に動かせる
  deploy-frontend:
    name: Deploy Frontend (develop)
    needs: [changes, lint, frontend-e2e]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare .env file
        run: |
          aws ssm get-parameter --name /github/quizzer/dev --output json | jq -r .Parameter.Value > .env
          cut -d= -f2 .env  | xargs -I arg echo ::add-mask::arg
          cat .env >> "$GITHUB_ENV"

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Setup dependencies(infra)
        run: cd ./infra && npm ci --production

      # frontendをビルド
      - name: Next.js Build and Export(Frontend)
        run: cd ./frontend-next && pnpm run export

      - name: Build Storybook
        run: cd ./frontend-next && rm -rf storybook-static && pnpm run build-storybook && mkdir -p out/storybook && cp -r storybook-static/* out/storybook/

      - name: Deploy backend stack
        run: cd ./infra && npx cdk deploy BackendStack --require-approval never

      - name: Deploy frontend stack
        run: cd ./infra && npx cdk deploy FrontendStack --require-approval never

      - name: Frontend Deploy # S3にデプロイ
        run: cd ./frontend-next && aws s3 sync --region ap-northeast-1 ./out s3://dev-quizzer-front-bucket --delete

      # Cloudfront キャッシュ削除
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"

  deploy-mock:
    name: Deploy to Mock Environment
    needs: [changes, lint, frontend-e2e]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Setup dependencies(infra)
        run: cd ./infra && npm ci --production

      # モック環境用フロントエンドビルド
      - name: Next.js Build and Export(Frontend for Mock)
        env:
          NEXT_PUBLIC_MOCK_MODE: true
          NEXT_PUBLIC_URL_END: '/index.html'
        run: cd ./frontend-next && pnpm run export

      # モック環境用S3アップロード
      - name: Upload mock files to S3
        run: |
          cd ./infra
          # S3バケット名を取得してアップロード
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name MockStack --query 'Stacks[0].Outputs[?OutputKey==`MockBucketName`].OutputValue' --output text)
          aws s3 sync ../frontend-next/out/ s3://$BUCKET_NAME/ --delete

      # モック環境用CloudFrontキャッシュ無効化
      - name: Invalidate Mock CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name MockStack --query 'Stacks[0].Outputs[?OutputKey==`MockDistributionId`].OutputValue' --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      # # モック環境URLの出力
      # - name: Output mock URL
      #   run: |
      #     MOCK_URL=$(aws cloudformation describe-stacks --stack-name MockStack --query 'Stacks[0].Outputs[?OutputKey==`MockWebsiteURL`].OutputValue' --output text)
      #     echo "Mock environment deployed at: $MOCK_URL"
