name: Lint

# developへのpush時にdevelop.ymlから呼び出され、エラーが無い場合だけデプロイに進む(警告だけなら成功扱い)
# Actionsの画面から手動でも実行できる
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint (quizzer-lib / backend / frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # backend・frontendの型情報を使うルールが quizzer-lib の型(dist)を参照するため、lib のビルドまで行う
      - name: Setup workspace
        uses: ./.github/actions/setup

      # backendは --fix なしの lint:check を使う(ルートの pnpm lint)
      - name: Run ESLint
        run: pnpm lint
